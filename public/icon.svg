<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#grad1)" />
  <!-- Radar grid circles -->
  <circle cx="32" cy="32" r="22" stroke="white" stroke-opacity="0.15" stroke-width="1.5" />
  <circle cx="32" cy="32" r="14" stroke="white" stroke-opacity="0.25" stroke-width="1.5" />
  <circle cx="32" cy="32" r="6" stroke="white" stroke-opacity="0.35" stroke-width="1.5" />
  <!-- Radar axis lines -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="white" stroke-opacity="0.2" stroke-width="1.5" />
  <line x1="10" y1="32" x2="54" y2="32" stroke="white" stroke-opacity="0.2" stroke-width="1.5" />
  <!-- Competency polygon shape -->
  <polygon points="32,14 47,24 43,44 23,48 18,28" fill="url(#grad2)" fill-opacity="0.6" stroke="white" stroke-width="2" stroke-linejoin="round" />
  <!-- Nodes -->
  <circle cx="32" cy="14" r="3" fill="#ffffff" />
  <circle cx="47" cy="24" r="3" fill="#ffffff" />
  <circle cx="43" cy="44" r="3" fill="#ffffff" />
  <circle cx="23" cy="48" r="3" fill="#ffffff" />
  <circle cx="18" cy="28" r="3" fill="#ffffff" />
</svg>
